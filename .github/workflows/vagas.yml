name: Buscar vagas

on:
  schedule:
    - cron: "17 11 * * 1,4"   # segunda e quinta, 8h17 de Brasília (minuto quebrado evita atrasos)
  workflow_dispatch:          # permite rodar manualmente pelo botão

permissions:
  contents: write

jobs:
  vagas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Buscar vagas
        run: python buscar_vagas.py
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          JOOBLE_API_KEY: ${{ secrets.JOOBLE_API_KEY }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}

      - name: Salvar no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "vagas $(date +%F)"
          git push